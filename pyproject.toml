[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "font-synthesis"
version = "0.2.0"
description = "Handwriting synthesis: generate SVG from text using PyTorch on Apple M4"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "numpy",
    "scipy>=1.0.0",
    "svgwrite>=1.1.12",
    "pillow",
]

[project.optional-dependencies]
pdf = ["svglib", "reportlab"]
gui = ["cairosvg"]

[project.scripts]
font-synth     = "main:main"
font-synth-pdf = "pdf:main"
